# Keep local commits aligned with the SwiftFormat and SwiftLint checks in CI.
repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat --config .swiftformat
        language: system
        files: \.swift$
        stages: [pre-commit]
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --config .swiftlint.yml --cache-path /tmp/pushapp-blocker-swiftlint-cache
        language: system
        files: \.swift$
        pass_filenames: false
        stages: [pre-commit]
